name: WeatherNYC
options:
  bundleIdPrefix: com.daeseongkim
  deploymentTarget:
    iOS: "26.0"
targets:
  WeatherNYC:
    type: application
    platform: iOS
    sources: [WeatherNYC]
    info:
      path: WeatherNYC/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.daeseongkim.weathernyc.refresh]
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daeseongkim.weathernyc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: UES Weather
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58S28HKMB9
